<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Support Desk{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f5f0e8;
      --bg2:       #ede8df;
      --surface:   #faf7f2;
      --border:    #d9d0c0;
      --border2:   #c8bfad;
      --ink:       #1c1710;
      --ink2:      #4a4236;
      --muted:     #8a7e6e;
      --accent:    #c4522a;
      --accent-bg: #f9ede7;
      --accent2:   #2a6b7c;
      --accent2-bg:#e7f0f3;
      --green:     #3a6b3a;
      --green-bg:  #e8f0e8;
      --radius:    5px;
      --font-head: 'Lora', Georgia, serif;
      --font-mono: 'IBM Plex Mono', monospace;
      --shadow:    0 1px 3px rgba(28,23,16,0.08), 0 4px 12px rgba(28,23,16,0.06);
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.65;
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0 36px;
      height: 54px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      box-shadow: 0 1px 0 var(--border);
    }
    nav .logo {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 17px;
      font-style: italic;
      color: var(--accent);
      text-decoration: none;
      margin-right: auto;
      letter-spacing: -0.01em;
    }
    nav .nav-links { display: flex; align-items: center; gap: 4px; }
    nav .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: var(--radius);
      transition: background 0.15s, color 0.15s;
    }
    nav .nav-links a:hover { background: var(--bg2); color: var(--ink); }
    nav .nav-links a.active { background: var(--bg2); color: var(--ink2); }

    /* ── LAYOUT ── */
    .page { padding: 40px 36px; max-width: 980px; margin: 0 auto; }

    .page-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 28px;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .page-header h1 {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 26px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .page-header .sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    /* ── BADGES ── */
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .badge-open       { background: var(--green-bg);   color: var(--green);   border: 1px solid #c0d8c0; }
    .badge-closed     { background: var(--bg2);         color: var(--muted);   border: 1px solid var(--border); }
    .badge-high       { background: #fdecea;             color: #b53030;        border: 1px solid #f0c5c0; }
    .badge-medium     { background: #fdf6e3;             color: #8a6200;        border: 1px solid #e8d898; }
    .badge-low        { background: var(--accent2-bg);  color: var(--accent2); border: 1px solid #c0d8e0; }
    .badge-unassigned { background: #f5edf8;             color: #7040a0;        border: 1px solid #dcc8ec; }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    /* ── TABLE ── */
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
    }
    thead th:first-child { border-radius: var(--radius) 0 0 0; }
    thead th:last-child  { border-radius: 0 var(--radius) 0 0; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg2); }
    td { padding: 11px 14px; vertical-align: middle; }
    td a { color: var(--ink2); text-decoration: none; }
    td a:hover { color: var(--accent); }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 15px;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
      letter-spacing: 0.01em;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary   { background: var(--accent); color: #fff; box-shadow: 0 1px 3px rgba(196,82,42,0.3); }
    .btn-secondary { background: var(--surface); color: var(--ink2); border: 1px solid var(--border2); }
    .btn-danger    { background: #b53030; color: #fff; box-shadow: 0 1px 3px rgba(181,48,48,0.3); }
    .btn-ghost     { background: transparent; color: var(--accent2); border: 1px solid #b8d4dc; }
    .btn:hover     { opacity: 0.88; }

    /* ── FORM ── */
    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    label {
      font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); font-weight: 500;
    }
    input[type="text"], input[type="email"], input[type="password"],
    textarea, select {
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 13.5px;
      padding: 8px 11px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      width: 100%;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(196,82,42,0.12);
    }
    textarea { resize: vertical; min-height: 80px; }
    select option { background: var(--surface); }

    /* ── CHAT WINDOW ── */
    .chat-window {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-height: 360px;
      max-height: 480px;
      overflow-y: auto;
    }

    /* Client bubble = right, terracotta */
    .msg-client {
      align-self: flex-end;
      max-width: 68%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .msg-client .bubble {
      background: var(--accent);
      color: #fff;
      padding: 9px 14px;
      border-radius: 14px 14px 3px 14px;
      font-size: 13.5px;
      line-height: 1.55;
    }
    .msg-client .meta {
      font-size: 10px; color: var(--muted); margin-top: 4px;
      display: flex; align-items: center; gap: 6px;
    }
    .msg-client .meta .who { color: var(--accent); font-weight: 500; }

    /* Operator bubble = left, teal */
    .msg-operator {
      align-self: flex-start;
      max-width: 68%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .msg-operator .bubble {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 9px 14px;
      border-radius: 14px 14px 14px 3px;
      font-size: 13.5px;
      line-height: 1.55;
    }
    .msg-operator .meta {
      font-size: 10px; color: var(--muted); margin-top: 4px;
      display: flex; align-items: center; gap: 6px;
    }
    .msg-operator .meta .who { color: var(--accent2); font-weight: 500; }

    .chat-input-row { display: flex; gap: 10px; margin-top: 12px; align-items: flex-end; }
    .chat-input-row textarea { flex: 1; min-height: 44px; max-height: 120px; }

    /* ── SECTION TITLE ── */
    .section-title {
      font-family: var(--font-head);
      font-size: 12px;
      font-weight: 600;
      font-style: italic;
      letter-spacing: 0.03em;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── PROFILE GRID ── */
    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .profile-field { display: flex; flex-direction: column; gap: 3px; }
    .field-label {
      font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    }
    .field-value { font-size: 14px; color: var(--ink); }

    /* ── EMPTY ── */
    .empty {
      text-align: center; padding: 48px 20px; color: var(--muted);
      font-family: var(--font-head); font-style: italic;
    }
    .empty .empty-icon { font-size: 32px; margin-bottom: 10px; }

    /* ── MODAL ── */
    .modal-panel {
      position: fixed; inset: 0;
      background: rgba(28,23,16,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      backdrop-filter: blur(3px);
    }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 30px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(28,23,16,0.25);
    }
    .modal-box h2 {
      font-family: var(--font-head);
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 18px;
      color: var(--ink);
    }

    /* ── COUNT PILL ── */
    .count-pill {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--accent); color: #fff;
      border-radius: 10px; min-width: 20px; height: 18px;
      font-size: 10px; font-weight: 600; padding: 0 5px;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav>
    <a class="logo" href="/">Support Desk</a>
    <div class="nav-links">{% block nav_links %}{% endblock %}</div>
  </nav>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
