<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Support Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #f5f0e8;
      --surface: #faf7f2;
      --border:  #d9d0c0;
      --ink:     #1c1710;
      --ink2:    #4a4236;
      --muted:   #8a7e6e;
      --accent:  #c4522a;
      --radius:  5px;
      --font-head: 'Lora', Georgia, serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }
    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 13.5px;
    }
    .login-wrap {
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo h1 {
      font-family: var(--font-head);
      font-style: italic;
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    .login-logo p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(28,23,16,0.07), 0 12px 40px rgba(28,23,16,0.06);
    }
    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    label {
      font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); font-weight: 500;
    }
    input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 13.5px;
      padding: 9px 12px;
      outline: none;
      width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(196,82,42,0.12);
    }
    .btn-submit {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      letter-spacing: 0.03em;
      transition: opacity 0.15s, transform 0.1s;
      box-shadow: 0 1px 3px rgba(196,82,42,0.35);
    }
    .btn-submit:hover { opacity: 0.88; }
    .btn-submit:active { transform: scale(0.98); }
    .error {
      background: #fdecea;
      border: 1px solid #f0c5c0;
      border-radius: var(--radius);
      color: #b53030;
      padding: 9px 12px;
      font-size: 12.5px;
      margin-bottom: 16px;
    }
    .login-hint {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 18px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <h1>Support Desk</h1>
      <p>Customer support platform</p>
    </div>
    <div class="login-card">
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <form method="POST" action="/login">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Your name" required autofocus />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••" required />
        </div>
        <button type="submit" class="btn-submit">Sign in →</button>
      </form>
    </div>
    <p class="login-hint">
      Enter your name and the shared password.<br/>
      You will be redirected based on your role.
    </p>
  </div>
</body>
</html>
